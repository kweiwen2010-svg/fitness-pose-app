<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 深蹲姿勢矯正助手</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; background: #121212; color: white; margin: 0; padding: 15px; }
    .status-card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
    .feedback { font-size: 1.3rem; font-weight: bold; margin-top: 8px; padding: 8px 12px; border-radius: 8px; display: inline-block; }
    .good { background: #1b4332; color: #52b788; }
    .warning { background: #5c1d24; color: #ff6b6b; }
    .info { color: #00ffcc; font-size: 1.2rem; font-weight: bold; }
    .container { position: relative; width: 100%; max-width: 480px; margin: 0 auto; }
    video { display: none; }
    canvas { width: 100%; border-radius: 12px; background: #000; transform: scaleX(-1); }
  </style>
</head>
<body>
  <h2>🏋️‍♂️ AI 深蹲姿勢矯正助手</h2>
  <div class="status-card">
    <div>標準次數：<span id="count" class="info">0</span> 次</div>
    <div id="feedback" class="feedback good">請讓全身側面入鏡，準備下蹲</div>
  </div>
  <div class="container">
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const countEl = document.getElementById('count');
    const feedbackEl = document.getElementById('feedback');

    let count = 0;
    let stage = 'up';
    let minKneeAngle = 180;
    let downFrames = 0; // 下蹲防閃爍計數器
    let lastSpeechTime = 0;

    function speak(text) {
      const now = Date.now();
      if (now - lastSpeechTime > 2200) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        window.speechSynthesis.speak(utterance);
        lastSpeechTime = now;
      }
    }

    function findAngle(a, b, c) {
      let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs(radians * 180.0 / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return angle;
    }

    function getTorsoLean(shoulder, hip) {
      let dx = shoulder.x - hip.x;
      let dy = shoulder.y - hip.y;
      return Math.abs(Math.atan2(dx, -dy) * 180.0 / Math.PI);
    }

    function setFeedback(msg, isWarning = false) {
      feedbackEl.innerText = msg;
      if (isWarning) {
        feedbackEl.className = "feedback warning";
        speak(msg.replace('⚠️ ', ''));
      } else {
        feedbackEl.className = "feedback good";
      }
    }

    // 關節可信度過濾器
    function isLandmarkValid(...pts) {
      return pts.every(p => p && p.visibility > 0.65);
    }

    function onResults(results) {
      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 480;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        const landmarks = results.poseLandmarks;
        const shoulder = landmarks[11];
        const hip = landmarks[23];
        const knee = landmarks[25];
        const ankle = landmarks[27];

        // 嚴格檢測：四個關鍵點的可信度皆須超過 65%
        if (isLandmarkValid(shoulder, hip, knee, ankle)) {
          const kneeAngle = findAngle(hip, knee, ankle);
          const torsoLean = getTorsoLean(shoulder, hip);
          const kneeOverToe = (knee.x - ankle.x);

          let skeletonColor = '#00FF00';
          let isWarning = false;
          let currentAdvice = "姿勢良好";

          // 下蹲觸發門檻 (膝蓋角度 < 130)
          if (kneeAngle < 130) {
            downFrames++;
            if (kneeAngle < minKneeAngle) minKneeAngle = kneeAngle;

            // 必須連續 3 個影格皆小於 130 度，排除雜訊誤跳
            if (downFrames >= 3) {
              stage = 'down';

              if (torsoLean > 40) {
                currentAdvice = "⚠️ 上半身過度前傾！請挺胸";
                isWarning = true;
              } else if (kneeOverToe > 0.12) {
                currentAdvice = "⚠️ 膝蓋過度前壓！重心往後移";
                isWarning = true;
              }
            }
          } else {
            downFrames = Math.max(0, downFrames - 1);
          }

          // 起身完成判定 (膝蓋角度 > 160 且曾進入過 down 階段)
          if (kneeAngle > 160 && stage === 'down') {
            if (minKneeAngle > 100) {
              setFeedback("⚠️ 蹲得不夠深！大腿需平行地面", true);
            } else if (!isWarning) {
              count++;
              countEl.innerText = count;
              setFeedback("✅ 標準深蹲 +1！", false);
              speak("標準");
            }
            stage = 'up';
            minKneeAngle = 180;
            downFrames = 0;
          } else if (stage === 'down') {
            setFeedback(currentAdvice, isWarning);
            skeletonColor = isWarning ? '#FF0000' : '#00FF00';
          }

          drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, {color: skeletonColor, lineWidth: 4});
          drawLandmarks(canvasCtx, landmarks, {color: '#FFFFFF', lineWidth: 2});
        } else {
          // 偵測點不清晰時重置下蹲狀態，防止留存錯誤數據
          downFrames = 0;
        }
      }
      canvasCtx.restore();
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await pose.send({image: videoElement}); },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>

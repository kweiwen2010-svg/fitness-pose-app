<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 深蹲姿勢矯正助手</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; background: #121212; color: white; margin: 0; padding: 15px; }
    .status-card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 12px; }
    .feedback { font-size: 1.2rem; font-weight: bold; margin-top: 8px; padding: 8px 12px; border-radius: 8px; display: inline-block; }
    .good { background: #1b4332; color: #52b788; }
    .warning { background: #5c1d24; color: #ff6b6b; }
    .info { color: #00ffcc; font-size: 1.4rem; font-weight: bold; }
    .btn { background: #007aff; color: white; border: none; padding: 14px 28px; font-size: 1.2rem; font-weight: bold; border-radius: 10px; cursor: pointer; margin-bottom: 12px; width: 100%; max-width: 480px; }
    .btn-stop { background: #d90429; }
    .container { position: relative; width: 100%; max-width: 480px; margin: 0 auto; }
    video { display: none; }
    canvas { width: 100%; border-radius: 12px; background: #000; transform: scaleX(-1); }
  </style>
</head>
<body>
  <h2>🏋️‍♂️ AI 深蹲姿勢矯正助手</h2>
  
  <button id="startBtn" class="btn" onclick="toggleCamera()">▶️ 按下開始運動</button>

  <div class="status-card">
    <div>標準深蹲：<span id="count" class="info">0</span> 次</div>
    <div id="feedback" class="feedback good">請點擊「開始運動」啟動檢測</div>
  </div>

  <div class="container">
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const countEl = document.getElementById('count');
    const feedbackEl = document.getElementById('feedback');
    const startBtn = document.getElementById('startBtn');

    let camera = null;
    let isRunning = false;
    let count = 0;
    let stage = 'up';
    let minKneeAngle = 180;
    let downFrames = 0;
    let lastSpeechTime = 0;

    function speak(text) {
      const now = Date.now();
      if (now - lastSpeechTime > 2200) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        window.speechSynthesis.speak(utterance);
        lastSpeechTime = now;
      }
    }

    function toggleCamera() {
      if (!isRunning) {
        // 解鎖手機聲音與播放權限
        speak("開始檢測，請站遠讓全身入鏡");
        startBtn.innerText = "⏹️ 停止運動";
        startBtn.classList.add("btn-stop");
        isRunning = true;
        initCamera();
      } else {
        if (camera) camera.stop();
        startBtn.innerText = "▶️ 按下開始運動";
        startBtn.classList.remove("btn-stop");
        isRunning = false;
        setFeedback("已暫停運動", false);
      }
    }

    function findAngle(a, b, c) {
      let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs(radians * 180.0 / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return angle;
    }

    function getTorsoLean(shoulder, hip) {
      let dx = shoulder.x - hip.x;
      let dy = shoulder.y - hip.y;
      return Math.abs(Math.atan2(dx, -dy) * 180.0 / Math.PI);
    }

    function setFeedback(msg, isWarning = false) {
      feedbackEl.innerText = msg;
      if (isWarning) {
        feedbackEl.className = "feedback warning";
        speak(msg.replace('⚠️ ', ''));
      } else {
        feedbackEl.className = "feedback good";
      }
    }

    function onResults(results) {
      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 480;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        const landmarks = results.poseLandmarks;
        
        // 只要抓到骨架就畫出連線，讓使用者確定 AI 有在運作
        drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 3});
        drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2});

        const shoulder = landmarks[11];
        const hip = landmarks[23];
        const knee = landmarks[25];
        const ankle = landmarks[27];

        // 檢查關鍵部位（髖、膝、腳踝）是否完整拍到
        const hasFullBody = hip && knee && ankle && hip.visibility > 0.5 && knee.visibility > 0.5 && ankle.visibility > 0.5;

        if (!hasFullBody) {
          setFeedback("⚠️ 請往後退，讓雙腳與腳踝入鏡！", true);
          downFrames = 0;
        } else {
          const kneeAngle = findAngle(hip, knee, ankle);
          const torsoLean = getTorsoLean(shoulder, hip);
          const kneeOverToe = (knee.x - ankle.x);

          let isWarning = false;
          let currentAdvice = "全身已鎖定，請開始下蹲";

          if (kneeAngle < 130) {
            downFrames++;
            if (kneeAngle < minKneeAngle) minKneeAngle = kneeAngle;

            if (downFrames >= 2) {
              stage = 'down';

              if (torsoLean > 40) {
                currentAdvice = "⚠️ 上半身過度前傾！請挺胸";
                isWarning = true;
              } else if (kneeOverToe > 0.12) {
                currentAdvice = "⚠️ 膝蓋過度前壓！重心往後移";
                isWarning = true;
              }
            }
          } else {
            downFrames = Math.max(0, downFrames - 1);
          }

          if (kneeAngle > 160 && stage === 'down') {
            if (minKneeAngle > 100) {
              setFeedback("⚠️ 蹲得不夠深！大腿需平行地面", true);
            } else if (!isWarning) {
              count++;
              countEl.innerText = count;
              setFeedback("✅ 標準深蹲 +1！", false);
              speak("標準");
            }
            stage = 'up';
            minKneeAngle = 180;
            downFrames = 0;
          } else if (stage === 'down') {
            setFeedback(currentAdvice, isWarning);
          } else if (stage === 'up' && !isWarning) {
            setFeedback(currentAdvice, false);
          }
        }
      } else {
        setFeedback("尋找人體骨架中...", false);
      }
      canvasCtx.restore();
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    function initCamera() {
      camera = new Camera(videoElement, {
        onFrame: async () => {
          if (isRunning) await pose.send({image: videoElement});
        },
        width: 640,
        height: 480
      });
      camera.start();
    }
  </script>
</body>
</html>
